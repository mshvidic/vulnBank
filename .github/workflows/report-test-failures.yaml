name: Run Tests and Report Failures

on:
  push:
    branches:
      - '**'

permissions:
  contents: write
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright Tests
        continue-on-error: true
        run: npx playwright test --reporter=list,json,allure-playwright
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report.json

      - name: Create Individual Issues for Failed Tests
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let report;
            try {
              report = JSON.parse(fs.readFileSync('playwright-report.json', 'utf8'));
            } catch (e) {
              console.log('Could not read playwright-report.json.');
              return;
            }

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;
            // Note: this points at the Allure report for the latest run (Pages always serves
            // the most recent publish), not one scoped to this specific failure. The report for
            // THIS run is built and published by later steps in this same job, so the link below
            // won't show this run's results until the job finishes — only a moment's delay.
            const allureUrl = `https://${owner}.github.io/${repo}/`;
            const branch = context.ref_name;

            // Load external issue template file
            const template = fs.readFileSync('.github/ISSUE_TEMPLATE/test-failure-report-template.md', 'utf8');

            function getFailedTests(suites, currentFile = '') {
              let failed = [];
              for (const suite of suites) {
                const fileName = suite.file || currentFile;
                if (suite.specs) {
                  for (const spec of suite.specs) {
                    for (const test of spec.tests) {
                      if (test.results.some(r => r.status === 'failed' || r.status === 'timedOut')) {
                        failed.push({ title: spec.title, file: fileName, line: spec.line });
                      }
                    }
                  }
                }
                if (suite.suites) failed = failed.concat(getFailedTests(suite.suites, fileName));
              }
              return failed;
            }

            const failedTests = getFailedTests(report.suites || []);
            const issues = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: ['automated-test-failure'] });

            for (const test of failedTests) {
              const issueTitle = `🚨 Test Failure: ${test.title} (${test.file})`;
              const exists = issues.data.find(i => i.title === issueTitle);

              if (!exists) {
                // Populate template placeholders with dynamic test values
                const body = template
                  .replace(/\$TEST_NAME/g, test.title)
                  .replace(/\$SPEC_FILE/g, `${test.file}:${test.line}`)
                  .replace(/\$BRANCH_NAME/g, branch)
                  .replace(/\$RUN_URL/g, runUrl)
                  .replace(/\$ALLURE_URL/g, allureUrl);

                await github.rest.issues.create({
                  owner,
                  repo,
                  title: issueTitle,
                  body: body,
                  labels: ['bug', 'automated-test-failure', 'security']
                });
                console.log(`Created issue for: ${test.title}`);
              }
            }

      - name: Check out previous report (for Allure history/trend)
        if: always()
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      - name: Build Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: allure-results
          allure_history: allure-history
          gh_pages: gh-pages
          keep_reports: 20

      - name: Publish Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history